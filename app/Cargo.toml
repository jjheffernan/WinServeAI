[package]
name = "winserve"
description = "Windows-native llama.cpp server manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "winserve"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
