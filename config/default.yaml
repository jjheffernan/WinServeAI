server:
  port: 8080
  host: 127.0.0.1

model:
  # First-run: set to a local .gguf (tray Settings → Browse, or edit this file).
  # See docs/first-run.md / config/FIRST_RUN.txt — no models are bundled.
  path: ""

gpu:
  auto: true
  layers: auto

runtime:
  context: 32768
  flash_attention: true

logging:
  dir: logs
  max_bytes: 10485760
  max_age_secs: 604800
  keep: 3
